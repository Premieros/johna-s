name: Temporary kitchen ticket fix v2

on:
  push:
    branches:
      - fix/kitchen-ticket-notes-paper-height-v2-20260916

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kitchen-ticket-notes-paper-height-v2-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/kitchen_patch.py
          python /tmp/kitchen_patch.py
      - name: Verify targeted tests and build
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npx vitest run tests/components/kitchen-ticket-notes-paper-height.test.ts
          npm run build
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/tmp-kitchen-ticket-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/pos/utils/printing.ts src/features/pos/hooks/usePosOrderBase.ts tests/components/kitchen-ticket-notes-paper-height.test.ts .github/workflows/tmp-kitchen-ticket-fix-v2.yml
          git commit -m "fix(pos): show kitchen notes and trim ticket paper"
          git push origin HEAD:fix/kitchen-ticket-notes-paper-height-v2-20260916
