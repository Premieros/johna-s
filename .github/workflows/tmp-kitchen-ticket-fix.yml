name: Temporary kitchen ticket fix

on:
  push:
    branches:
      - fix/kitchen-ticket-notes-paper-height-20260916

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kitchen-ticket-notes-paper-height-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted kitchen ticket changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          printing = Path('src/features/pos/utils/printing.ts')
          text = printing.read_text()
          text = text.replace(
            "  items: { name: string; qty: number; unit_name?: string | null }[];\n  s: Settings;",
            "  items: { name: string; qty: number; unit_name?: string | null; note?: string | null }[];\n  orderNote?: string | null;\n  s: Settings;",
            1,
          )
          text = text.replace(
            "  const { orderNumber, tableName, orderTypeLabel, guestCount, items, isAr } = params;",
            "  const { orderNumber, tableName, orderTypeLabel, guestCount, items, orderNote, isAr } = params;",
            1,
          )
          pattern = re.compile(r"  const estimatedItemMm = items\.reduce\(\(sum, item\) => \{.*?  const rows = items\n    \.map\(\(i\) => `.*?`\)\n    \.join\(''\);", re.S)
          replacement = r'''  const estimateLines = (value: unknown, wrapAt: number) => {
    const normalized = String(value || '').trim();
    if (!normalized) return 0;
    return normalized.split(/\r?\n/).reduce((sum, line) => sum + Math.max(1, Math.ceil(line.length / wrapAt)), 0);
  };
  const estimatedItemMm = items.reduce((sum, item) => {
    const wrapAt = compact ? 16 : 24;
    const nameLines = Math.max(1, estimateLines(item.name, wrapAt));
    const noteLines = estimateLines(item.note, compact ? 20 : 28);
    return sum + 7.5 + (nameLines * 4.8) + (noteLines * 4.2);
  }, 0);
  const orderNoteLines = estimateLines(orderNote, compact ? 22 : 30);
  const pageHeightMm = Math.max(45, Math.ceil(25 + (metaRows * 5) + (orderNoteLines * 4.2) + estimatedItemMm + 9));
  const rows = items
    .map((i) => `<section class="item-row"><div class="item-line"><strong class="qty-badge">${escapeHtml(i.qty)}×</strong><div class="item-name">${escapeHtml(i.name)}${i.unit_name && i.unit_name !== 'piece' ? ` <span class="unit">(${escapeHtml(i.unit_name)})</span>` : ''}</div></div><div class="qty-caption">${isAr ? 'الكمية' : 'Qty'}: <strong>${escapeHtml(i.qty)}</strong></div>${i.note ? `<div class="item-note"><strong>${isAr ? 'ملاحظة' : 'Note'}:</strong> ${escapeHtml(i.note)}</div>` : ''}</section>`)
    .join('');'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'kitchen estimate block replacement count={count}')
          text = text.replace(
            "        .unit { font-size: .72em; font-weight: 700; }\n        .qty-caption {",
            "        .unit { font-size: .72em; font-weight: 700; }\n        .item-note { margin-top: 1.2mm; padding: 1.2mm 1.5mm; border: .3mm solid #000; font-size: ${metaFontPx}px; line-height: 1.35; font-weight: 800; white-space: pre-wrap; overflow-wrap: anywhere; }\n        .order-note { margin: 1.5mm 0; padding: 1.5mm; border: .4mm solid #000; font-size: ${metaFontPx}px; line-height: 1.35; font-weight: 900; white-space: pre-wrap; overflow-wrap: anywhere; }\n        .qty-caption {",
            1,
          )
          text = text.replace(
            "        ${guestCount ? `<div class=\"meta-row\">${isAr ? 'الضيوف' : 'Guests'}: ${guestCount}</div>` : ''}\n        <div class=\"divider\"></div>\n        ${rows}",
            "        ${guestCount ? `<div class=\"meta-row\">${isAr ? 'الضيوف' : 'Guests'}: ${guestCount}</div>` : ''}\n        ${orderNote ? `<div class=\"order-note\"><strong>${isAr ? 'ملاحظات الطلب' : 'Order notes'}:</strong> ${escapeHtml(orderNote)}</div>` : ''}\n        <div class=\"divider\"></div>\n        ${rows}",
            1,
          )
          printing.write_text(text)

          hook = Path('src/features/pos/hooks/usePosOrderBase.ts')
          text = hook.read_text()
          replacements = [
            (
              "            guestCount,\n            items: (res.sent || []).map((i) => ({ name: i.product_name || '—', qty: Number(i.quantity), unit_name: i.unit_name })),\n            s: effSettings,",
              "            guestCount,\n            orderNote: orderNotes || null,\n            items: (res.sent || []).map((i) => ({ name: i.product_name || '—', qty: Number(i.quantity), unit_name: i.unit_name, note: i.notes || null })),\n            s: effSettings,",
            ),
            (
              "      guestCount,\n      items: cart.map((i) => ({ name: i.product.name, qty: i.quantity, unit_name: i.unit_name })),\n      s: effSettings,",
              "      guestCount,\n      orderNote: orderNotes || null,\n      items: cart.map((i) => ({ name: i.product.name, qty: i.quantity, unit_name: i.unit_name, note: i.item_note || null })),\n      s: effSettings,",
            ),
            (
              "  }, [cart.length, completing, orderLoading, kitchenSending, branchId, orderType, tableId, activeOrderNumber, persistCart, effSettings, activeTable, guestCount, t, isAr, onInventoryChanged, show]);",
              "  }, [cart.length, completing, orderLoading, kitchenSending, branchId, orderType, tableId, activeOrderNumber, persistCart, effSettings, activeTable, guestCount, orderNotes, t, isAr, onInventoryChanged, show]);",
            ),
            (
              "  }, [cart, effSettings, activeOrderNumber, activeTable, orderType, guestCount, t, isAr]);",
              "  }, [cart, effSettings, activeOrderNumber, activeTable, orderType, guestCount, orderNotes, t, isAr]);",
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit('hook replacement target missing')
            text = text.replace(old, new, 1)
          hook.write_text(text)

          test = Path('tests/components/kitchen-ticket-notes-paper-height.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest';
import fs from 'node:fs';
import path from 'node:path';

const root = process.cwd();
const printing = fs.readFileSync(path.join(root, 'src/features/pos/utils/printing.ts'), 'utf8');
const hook = fs.readFileSync(path.join(root, 'src/features/pos/hooks/usePosOrderBase.ts'), 'utf8');

describe('kitchen ticket notes and paper height', () => {
  it('prints order and item notes in the kitchen ticket', () => {
    expect(printing).toContain('orderNote?: string | null');
    expect(printing).toContain('item-note');
    expect(printing).toContain('order-note');
    expect(hook).toContain('orderNote: orderNotes || null');
    expect(hook).toContain('note: i.notes || null');
    expect(hook).toContain('note: i.item_note || null');
  });

  it('uses compact content-based paper height instead of an 80mm minimum', () => {
    expect(printing).toContain('Math.max(45, Math.ceil(');
    expect(printing).not.toContain('Math.max(80, Math.ceil(');
    expect(printing).toContain('orderNoteLines');
    expect(printing).toContain('noteLines');
  });
});
""")
          PY
      - name: Verify targeted tests and build
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npx vitest run tests/components/kitchen-ticket-notes-paper-height.test.ts
          npm run build
      - name: Remove temporary workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/tmp-kitchen-ticket-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/pos/utils/printing.ts src/features/pos/hooks/usePosOrderBase.ts tests/components/kitchen-ticket-notes-paper-height.test.ts .github/workflows/tmp-kitchen-ticket-fix.yml
          git commit -m "fix(pos): show kitchen notes and trim ticket paper"
          git push origin HEAD:fix/kitchen-ticket-notes-paper-height-20260916
