name: Restore POS workspace safely
on:
  push:
    branches: [development/pos-hardening-20260916]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/pos-hardening-20260916
          fetch-depth: 0
      - name: Restore and apply minimal table-pay wiring
        run: |
          set -euo pipefail
          git show 2f92cf363f72e521183e7703e61e7146a97bf602:src/features/pos/pages/PosWorkspacePage.tsx > src/features/pos/pages/PosWorkspacePage.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/pos/pages/PosWorkspacePage.tsx')
          s = p.read_text()
          s = s.replace("import { ShoppingCart, Printer, Barcode as BarcodeIcon } from 'lucide-react';", "import { ShoppingCart, Printer } from 'lucide-react';", 1)
          needle = """      <TablesPanel
        open={panel === 'tables'}
        onClose={() => setPanel(null)}
        tables={tables}
        ordersByTable={ordersByTable}
        currency={pos.effCurrency}"""
          replacement = """      <TablesPanel
        open={panel === 'tables'}
        onClose={() => setPanel(null)}
        tables={tables}
        ordersByTable={ordersByTable}
        kitchenSendsByOrder={kitchenSendsByOrder}
        currency={pos.effCurrency}"""
          if needle not in s:
              raise SystemExit('TablesPanel wiring marker not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/pos/pages/PosWorkspacePage.tsx
          git commit -m "fix(pos): restore workspace and wire kitchen sends"
          git push origin HEAD:development/pos-hardening-20260916
