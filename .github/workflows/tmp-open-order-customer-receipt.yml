name: Temporary open-order customer receipt fix

on:
  push:
    branches:
      - fix/pos-open-order-customer-receipt-20260916

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pos-open-order-customer-receipt-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          printing = Path('src/features/pos/utils/printing.ts')
          text = printing.read_text()
          text = text.replace(
            "  operatorName?: string | null;\n}",
            "  operatorName?: string | null;\n  isOpenOrder?: boolean;\n}",
            1,
          )
          old = """export async function buildReceiptHtml(receipt: ReceiptData, s: Settings, lang: Language, isAr: boolean): Promise<string> {\n  const authorization = await authorizeReceiptPrint(receipt);\n  const printToken = newPrintToken();\n  pendingReceiptPrints.set(printToken, {\n    authorization,\n    plainText: buildReceiptPlainText(receipt, s, lang, isAr),\n  });\n  window.setTimeout(() => pendingReceiptPrints.delete(printToken), 60_000);\n"""
          new = """export async function buildReceiptHtml(\n  receipt: ReceiptData,\n  s: Settings,\n  lang: Language,\n  isAr: boolean,\n  options?: { authorize?: boolean },\n): Promise<string> {\n  let printToken: string | null = null;\n  if (options?.authorize !== false) {\n    const authorization = await authorizeReceiptPrint(receipt);\n    printToken = newPrintToken();\n    pendingReceiptPrints.set(printToken, {\n      authorization,\n      plainText: buildReceiptPlainText(receipt, s, lang, isAr),\n    });\n    const tokenToDelete = printToken;\n    window.setTimeout(() => pendingReceiptPrints.delete(tokenToDelete), 60_000);\n  }\n"""
          assert old in text, 'buildReceiptHtml auth block not found'
          text = text.replace(old, new, 1)
          old = """    <div class=\"divider\"></div>\n    <div class=\"meta-row\"><span class=\"meta-value\">${isAr ? 'الفاتورة' : 'Invoice'}: ${escapeHtml(receipt.invoice)}</span></div>\n"""
          new = """    <div class=\"divider\"></div>\n    ${receipt.isOpenOrder ? `<div class=\"center open-order-label\">${isAr ? 'حساب مبدئي – غير مدفوع' : 'OPEN CHECK – NOT PAID'}</div>` : ''}\n    <div class=\"meta-row\"><span class=\"meta-value\">${receipt.isOpenOrder ? (isAr ? 'الطلب' : 'Order') : (isAr ? 'الفاتورة' : 'Invoice')}: ${escapeHtml(receipt.invoice)}</span></div>\n"""
          assert old in text, 'receipt header block not found'
          text = text.replace(old, new, 1)
          old = """    <div class=\"money-row total-row\"><span>${isAr ? 'الإجمالي' : 'Total'}</span><span class=\"amount\">${formatCurrency(receipt.total, currency, lang)}</span></div>\n    <div class=\"money-row\"><span>${isAr ? 'المدفوع' : 'Paid'}</span><span class=\"amount\">${formatCurrency(receipt.paid, currency, lang)}</span></div>\n    ${receipt.change > 0 ? `<div class=\"money-row\"><span>${isAr ? 'الباقي' : 'Change'}</span><span class=\"amount\">${formatCurrency(receipt.change, currency, lang)}</span></div>` : ''}\n"""
          new = """    <div class=\"money-row total-row\"><span>${isAr ? 'الإجمالي' : 'Total'}</span><span class=\"amount\">${formatCurrency(receipt.total, currency, lang)}</span></div>\n    ${receipt.isOpenOrder ? '' : `<div class=\"money-row\"><span>${isAr ? 'المدفوع' : 'Paid'}</span><span class=\"amount\">${formatCurrency(receipt.paid, currency, lang)}</span></div>`}\n    ${!receipt.isOpenOrder && receipt.change > 0 ? `<div class=\"money-row\"><span>${isAr ? 'الباقي' : 'Change'}</span><span class=\"amount\">${formatCurrency(receipt.change, currency, lang)}</span></div>` : ''}\n"""
          assert old in text, 'paid/change block not found'
          text = text.replace(old, new, 1)
          text = text.replace(
            "        .branch-name { font-weight: 700; }\n",
            "        .branch-name { font-weight: 700; }\n        .open-order-label { margin: 1mm 0 1.5mm; font-size: ${compact ? 12 : 13}px; font-weight: 900; border: .3mm solid #000; padding: 1mm; }\n",
            1,
          )
          text = text.replace(
            "      <meta name=\"johns-print-auth\" content=\"${escapeHtml(printToken)}\">",
            "      ${printToken ? `<meta name=\"johns-print-auth\" content=\"${escapeHtml(printToken)}\">` : ''}",
            1,
          )
          printing.write_text(text)

          hook = Path('src/features/pos/hooks/usePosOrderBase.ts')
          text = hook.read_text()
          old = """  const printReceipt = useCallback(async () => {\n    if (!lastReceipt || !effSettings) return;\n    try {\n      const html = await buildReceiptHtml(lastReceipt, effSettings, lang, isAr);\n      openPrintWindow(html, effSettings.receipt_width_mm || 80);\n    } catch (error) {\n      showReceiptPrintError(error);\n    }\n  }, [lastReceipt, effSettings, lang, isAr, showReceiptPrintError]);\n"""
          new = """  const printReceipt = useCallback(async () => {\n    if (!effSettings) return;\n    try {\n      if (cart.length > 0) {\n        const openOrderReceipt: ReceiptData = {\n          invoice: activeOrderNumber || `ORDER-${Date.now()}`,\n          branchName,\n          items: cart.map((i) => ({\n            name: [i.product.name, i.modifiers?.map((m) => m.name).join(' · ')].filter(Boolean).join(' — '),\n            qty: i.quantity,\n            price: i.unit_price,\n            total: i.quantity * i.unit_price - i.discount_amount,\n          })),\n          subtotal,\n          discount: discountValue,\n          tax: taxAmount,\n          total,\n          paid: 0,\n          change: 0,\n          date: new Date().toISOString(),\n          customerName: customers.find((c) => c.id === customerId)?.name || '',\n          orderNumber: activeOrderNumber || undefined,\n          tableName: activeTable?.name || undefined,\n          orderTypeLabel: t(ORDER_TYPE_KEY[orderType]),\n          guestCount: guestCount || undefined,\n          operatorName: user?.full_name || user?.username || user?.email || null,\n          isOpenOrder: true,\n        };\n        const html = await buildReceiptHtml(openOrderReceipt, effSettings, lang, isAr, { authorize: false });\n        openPrintWindow(html, effSettings.receipt_width_mm || 80);\n        return;\n      }\n      if (!lastReceipt) return;\n      const html = await buildReceiptHtml(lastReceipt, effSettings, lang, isAr);\n      openPrintWindow(html, effSettings.receipt_width_mm || 80);\n    } catch (error) {\n      showReceiptPrintError(error);\n    }\n  }, [cart, lastReceipt, effSettings, activeOrderNumber, branchName, subtotal, discountValue, taxAmount, total, customers, customerId, activeTable, orderType, guestCount, user, t, lang, isAr, showReceiptPrintError]);\n"""
          assert old in text, 'printReceipt block not found'
          text = text.replace(old, new, 1)
          hook.write_text(text)

          workspace = Path('src/features/pos/pages/PosWorkspacePage.tsx')
          text = workspace.read_text()
          old = "canPrintReceipt={!!pos.lastReceipt && pos.cart.length === 0}"
          new = "canPrintReceipt={pos.cart.length > 0 || !!pos.lastReceipt}"
          assert old in text, 'canPrintReceipt prop not found'
          workspace.write_text(text.replace(old, new, 1))

          test = Path('tests/components/pos-customer-receipt-print-contract.test.ts')
          text = test.read_text()
          text = text.replace(
            "    expect(header).toContain('disabled={!canPrintReceipt}');\n",
            "    expect(header).toContain('disabled={!canPrintReceipt}');\n    expect(workspace).toContain('canPrintReceipt={pos.cart.length > 0 || !!pos.lastReceipt}');\n",
            1,
          )
          insert = """\n  it('prints the current open table order as a customer check before payment', () => {\n    const hook = fs.readFileSync(path.join(root, 'src/features/pos/hooks/usePosOrderBase.ts'), 'utf8');\n    expect(hook).toContain('if (cart.length > 0)');\n    expect(hook).toContain('isOpenOrder: true');\n    expect(hook).toContain('buildReceiptHtml(openOrderReceipt, effSettings, lang, isAr, { authorize: false })');\n    expect(printing).toContain('options?: { authorize?: boolean }');\n    expect(printing).toContain('حساب مبدئي – غير مدفوع');\n  });\n"""
          marker = "\n  it('keeps the existing single-print and manager-approved reprint authorization'"
          assert marker in text, 'test marker not found'
          text = text.replace(marker, insert + marker, 1)
          test.write_text(text)
          PY
      - name: Verify targeted change
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npx vitest run tests/components/pos-customer-receipt-print-contract.test.ts
          npm run build
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/tmp-open-order-customer-receipt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/pos/utils/printing.ts src/features/pos/hooks/usePosOrderBase.ts src/features/pos/pages/PosWorkspacePage.tsx tests/components/pos-customer-receipt-print-contract.test.ts .github/workflows/tmp-open-order-customer-receipt.yml
          git commit -m "fix(pos): print open table order as customer check"
          git push origin HEAD:fix/pos-open-order-customer-receipt-20260916
