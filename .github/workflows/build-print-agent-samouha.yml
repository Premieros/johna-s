name: Build Johns Print Agent Samouha

on:
  pull_request:
    paths:
      - 'local-print-agent/standalone/agent-samouha.cjs'
      - 'local-print-agent/standalone/installer-samouha.iss'
      - 'local-print-agent/standalone/run-hidden-samouha.vbs'
      - 'local-print-agent/standalone/open-settings-samouha.vbs'
      - '.github/workflows/build-print-agent-samouha.yml'
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install packager
        shell: pwsh
        run: npm install -g @yao-pkg/pkg@6.22.0

      - name: Validate agent syntax
        shell: pwsh
        run: node --check local-print-agent/standalone/agent-samouha.cjs

      - name: Build standalone EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-samouha | Out-Null
          pkg local-print-agent/standalone/agent-samouha.cjs --targets node22-win-x64 --output build-samouha/JohnsPrintAgent-Samouha.exe

      - name: Smoke test Samouha stations
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:GITHUB_WORKSPACE\build-samouha\JohnsPrintAgent-Samouha.exe" -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 3
            $health = Invoke-RestMethod -Uri 'http://127.0.0.1:17654/health' -TimeoutSec 10
            if (-not $health.ok) { throw 'Health endpoint returned not-ok' }
            if ($health.branch -ne 'Samouha') { throw "Unexpected branch: $($health.branch)" }
            $stations = @($health.stations)
            if ($stations.Count -ne 3) { throw "Unexpected station count: $($stations.Count)" }
            foreach ($s in @('cashier','main','drinks')) { if ($stations -notcontains $s) { throw "Missing station: $s" } }
          }
          finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "local-print-agent\standalone\installer-samouha.iss"'

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash build-samouha\JohnsPrintAgent-Samouha.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  JohnsPrintAgent-Samouha.exe" } | Set-Content build-samouha\SHA256SUMS.txt
          Get-FileHash build-samouha\JohnsPrintAgent-Samouha-Setup-2.1.2.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  JohnsPrintAgent-Samouha-Setup-2.1.2.exe" } | Add-Content build-samouha\SHA256SUMS.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JohnsPrintAgent-Samouha-2.1.2-Windows
          path: |
            build-samouha/JohnsPrintAgent-Samouha-Setup-2.1.2.exe
            build-samouha/JohnsPrintAgent-Samouha.exe
            build-samouha/SHA256SUMS.txt
          if-no-files-found: error
