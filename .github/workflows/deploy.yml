name: Deploy to GitHub Pages

# Publish only a commit that has already passed ALL four verification jobs.
# GitHub Pages does not receive an independent, unverified push deployment.
on:
  workflow_run:
    workflows: ["Verify main"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: azzdesuowpdcoflmyezn
  VITE_SUPABASE_URL: https://azzdesuowpdcoflmyezn.supabase.co
  VITE_WORK_AUTHORIZATION_GATE: "1"
  # PILOT: ONLY Smoha; Cleopatra remains on legacy send. Server database
  # gate starts OFF and must be separately leased for <=5 minutes.
  # Rollback: disable the server lease immediately; then remove these flags.
  VITE_KITCHEN_ATOMIC_PRINT_HANDOFF: "true"
  VITE_KITCHEN_ATOMIC_PRINT_BRANCH_IDS: "19c3fd23-d784-455b-8840-f4f2ac619651"

jobs:
  build:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Ensure verified source is still current branch HEAD
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          case "$VERIFIED_BRANCH" in main|master) ;; *) exit 1 ;; esac
          actual="$(git ls-remote origin "refs/heads/$VERIFIED_BRANCH" | cut -f1)"
          test -n "$actual" && test "$actual" = "$VERIFIED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Verify locked Supabase project identity
        run: node scripts/db/verify-database-identity.js

      - run: npm run build
        env:
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Preserve assets for active sessions
        uses: ./.github/actions/preserve-pages-assets
        with:
          github-token: ${{ github.token }}
          deployment-branch: ${{ github.ref_name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 30

  production-parity:
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: azzdesuowpdcoflmyezn
      VITE_SUPABASE_URL: https://azzdesuowpdcoflmyezn.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Verify locked Supabase project identity
        run: node scripts/db/verify-database-identity.js
      - name: Verify frontend API contract is current
        run: node scripts/db/gen-contract.js --check
      - name: Verify Production API parity
        run: node scripts/db/check-production-parity.js

  deploy:
    needs: [build, production-parity]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Refuse stale source between verification and publication
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          case "$VERIFIED_BRANCH" in main|master) ;; *) exit 1 ;; esac
          actual="$(git ls-remote origin "refs/heads/$VERIFIED_BRANCH" | cut -f1)"
          test -n "$actual" && test "$actual" = "$VERIFIED_SHA"
      - id: deployment
        uses: actions/deploy-pages@v4
