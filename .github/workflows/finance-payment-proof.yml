name: Finance payment isolated SQL proof
on:
  pull_request:
    paths:
      - 'scripts/db/candidates/finance*'
      - 'scripts/rollback/finance_receive_payment_20261021.sql'
      - 'supabase/migrations/*_finance_receive_payment_projection.sql'
      - '.github/workflows/finance-payment-proof.yml'
permissions:
  contents: read
jobs:
  isolated-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned disposable Postgres engine
        run: npm install --prefix /tmp/finance-payment-proof --no-save --ignore-scripts @electric-sql/pglite@0.3.14
      - name: Reproduce original failure and verify repair and rollback on owned synthetic rows
        env:
          FINANCE_PGLITE_MODULE: /tmp/finance-payment-proof/node_modules/@electric-sql/pglite
        run: node scripts/db/candidates/finance-payment-proof.mjs
      - name: Verify reviewed candidate equals canonical migration
        run: cmp scripts/db/candidates/finance_receive_payment.sql supabase/migrations/*_finance_receive_payment_projection.sql
