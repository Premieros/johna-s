name: Apply one-line POS lint cleanup
on:
  push:
    branches: [development/pos-hardening-20260916]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/pos-hardening-20260916
      - name: Remove unused import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/pos/pages/PosWorkspacePage.tsx')
          s = p.read_text()
          old = "import { ShoppingCart, Printer, Barcode as BarcodeIcon } from 'lucide-react';"
          new = "import { ShoppingCart, Printer } from 'lucide-react';"
          if old not in s:
              raise SystemExit('target import not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/pos/pages/PosWorkspacePage.tsx
          git commit -m "fix(pos): remove unused barcode import"
          git push origin HEAD:development/pos-hardening-20260916
