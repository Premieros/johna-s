name: Temporary thermal receipt fit fix

on:
  push:
    branches:
      - fix/thermal-customer-receipt-no-crop-20260916

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/thermal-customer-receipt-no-crop-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/features/pos/utils/printing.ts')
          text = p.read_text()

          old = """  const sidePaddingMm = compact ? 2.4 : 3.2;\n  const bodyFontPx = compact ? 12 : 13;\n  const smallFontPx = compact ? 10 : 11;\n  const itemFontPx = compact ? 12 : 13;\n  const totalFontPx = compact ? 16 : 18;\n  const logoWidthMm = compact ? 28 : 36;\n  const qrWidthMm = compact ? 18 : 22;\n"""
          new = """  const safeContentWidthMm = Math.max(46, width - (compact ? 4 : 6));\n  const sidePaddingMm = compact ? 1.4 : 1.8;\n  const bodyFontPx = compact ? 11 : 12;\n  const smallFontPx = compact ? 9 : 10;\n  const itemFontPx = compact ? 11 : 12;\n  const totalFontPx = compact ? 15 : 17;\n  const logoWidthMm = compact ? 24 : 32;\n  const qrWidthMm = compact ? 16 : 20;\n"""
          assert old in text, 'receipt profile block not found'
          text = text.replace(old, new, 1)

          text = text.replace('          line-height: 1.45;\n', '          line-height: 1.35;\n', 1)
          text = text.replace('          width: ${width}mm;\n          min-height: 0;\n          padding: 3mm ${sidePaddingMm}mm 4mm;\n', '          width: ${safeContentWidthMm}mm;\n          max-width: ${safeContentWidthMm}mm;\n          min-height: 0;\n          margin: 0 auto;\n          padding: 2mm ${sidePaddingMm}mm 3mm;\n', 1)
          text = text.replace('          column-gap: 2mm;\n', '          column-gap: 1.2mm;\n', 1)
          text = text.replace('          padding: 1.5mm 0;\n', '          padding: 1.1mm 0;\n', 1)
          text = text.replace('          line-height: 1.4;\n          font-weight: 800;\n', '          line-height: 1.3;\n          font-weight: 800;\n', 1)
          text = text.replace('        .item-detail { font-size: ${smallFontPx}px; line-height: 1.4; font-weight: 600; }\n', '        .item-detail { font-size: ${smallFontPx}px; line-height: 1.3; font-weight: 600; min-width: 0; }\n', 1)
          text = text.replace('          margin: 1mm 0;\n          font-size: ${bodyFontPx}px;\n          line-height: 1.4;\n', '          margin: .8mm 0;\n          font-size: ${bodyFontPx}px;\n          line-height: 1.3;\n', 1)
          text = text.replace('            width: ${width}mm !important;\n            margin: 0 !important;\n            box-shadow: none !important;\n', '            width: ${safeContentWidthMm}mm !important;\n            max-width: ${safeContentWidthMm}mm !important;\n            margin: 0 auto !important;\n            box-shadow: none !important;\n', 1)

          p.write_text(text)

          test = Path('tests/components/customer-receipt-thermal-fit.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest';\nimport fs from 'node:fs';\nimport path from 'node:path';\n\nconst source = fs.readFileSync(path.join(process.cwd(), 'src/features/pos/utils/printing.ts'), 'utf8');\n\ndescribe('customer receipt thermal fit', () => {\n  it('uses a safe printable content width smaller than the paper roll', () => {\n    expect(source).toContain('const safeContentWidthMm = Math.max(46, width - (compact ? 4 : 6));');\n    expect(source).toContain('width: ${safeContentWidthMm}mm;');\n    expect(source).toContain('margin: 0 auto;');\n  });\n\n  it('keeps the paper page at configured thermal width while fitting content inside it', () => {\n    expect(source).toContain('width: ${width}mm;');\n    expect(source).toContain('max-width: ${safeContentWidthMm}mm !important;');\n  });\n});\n""")
          PY
      - name: Verify targeted change
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npx vitest run tests/components/customer-receipt-thermal-fit.test.ts tests/components/pos-customer-receipt-print-contract.test.ts
          npm run build
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/tmp-thermal-receipt-fit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/pos/utils/printing.ts tests/components/customer-receipt-thermal-fit.test.ts .github/workflows/tmp-thermal-receipt-fit.yml
          git commit -m "fix(pos): fit customer receipt to thermal paper"
          git push origin HEAD:fix/thermal-customer-receipt-no-crop-20260916
