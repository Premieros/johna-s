name: Build Cleopatra Print Agent V8.1.1 Lite

on:
  pull_request:
    paths:
      - 'print-agent-v8/**'
      - '.github/workflows/smouha-print-agent-v8-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v8-lite:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore print-agent-v8/PremierSmouhaFormPrintAgentV08.csproj

      - name: Publish V8.1.1 Lite Windows x64
        run: >
          dotnet publish print-agent-v8/PremierSmouhaFormPrintAgentV08.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:UseAppHost=true
          -p:PublishReadyToRun=false
          -o dist/Cleopatra-Form-Print-Agent-v8.1.1-Lite-Windows-x64

      - name: Package
        shell: pwsh
        run: |
          Copy-Item print-agent-v8/README.md dist/Cleopatra-Form-Print-Agent-v8.1.1-Lite-Windows-x64/README-V8.1.1-LITE.md
          $exe = Get-ChildItem dist/Cleopatra-Form-Print-Agent-v8.1.1-Lite-Windows-x64 -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'V8.1.1 Lite executable was not produced' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = $exe.Length
          @(
            "File: $($exe.Name)"
            "SHA256: $hash"
            "SizeBytes: $size"
            "Branch: Cleopatra"
            "Version: 8.1.1 Lite"
            "QueueEnabledDefault: false"
            "Requires: Microsoft Windows Desktop Runtime 8 x64"
          ) | Set-Content dist/Cleopatra-Form-Print-Agent-v8.1.1-Lite-Windows-x64/SHA256.txt -Encoding UTF8

      - name: Upload V8.1.1 Lite package
        uses: actions/upload-artifact@v4
        with:
          name: Cleopatra-Form-Print-Agent-v8.1.1-Lite-Windows-x64
          path: dist/Cleopatra-Form-Print-Agent-v8.1.1-Lite-Windows-x64/**
          if-no-files-found: error
          retention-days: 14
