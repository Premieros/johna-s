name: Isolated Windows local branch pilot
on:
  push:
    branches: [experiment/local-windows-20261020]
    paths: [.github/workflows/local-windows-pilot.yml]
permissions:
  contents: read
jobs:
  windows-local-pilot:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unpack isolated pilot source
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$PWD/pilot-source.zip", [Convert]::FromBase64String(''))
          Expand-Archive pilot-source.zip -DestinationPath build
          Invoke-WebRequest https://www.python.org/ftp/python/3.14.7/python-3.14.7-embed-amd64.zip -OutFile python-runtime.zip
          if ((Get-FileHash python-runtime.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd297e5ff019966817ad8502465176139f2d3d840fa4ed84b13bed399a6ab1f15') { throw 'Runtime digest mismatch' }
          Expand-Archive python-runtime.zip -DestinationPath build/Johnas-Local-Pilot/runtime
          [IO.File]::WriteAllText("$PWD/build/Johnas-Local-Pilot/runtime/python314._pth", "python314.zip`n.`n..\app`n")
      - name: Parse Windows installers and print renderer without executing installation or printing
        shell: pwsh
        run: |
          Get-ChildItem build/Johnas-Local-Pilot -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { $parseErrors | Out-String | Write-Error }
          }
      - name: Run local transaction, concurrency, backup, permission and HTTP tests using bundled Windows runtime
        shell: pwsh
        run: |
          & ./build/Johnas-Local-Pilot/runtime/python.exe -m unittest discover -s ./build/Johnas-Local-Pilot/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test cashier and mobile flows on Windows Edge with external browser requests blocked
        shell: pwsh
        run: |
          npm install --prefix .pilot-tools --no-save playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PILOT_PLAYWRIGHT="$PWD/.pilot-tools/node_modules/playwright"
          $env:PILOT_PYTHON="$PWD/build/Johnas-Local-Pilot/runtime/python.exe"
          node ./build/Johnas-Local-Pilot/tests/browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified isolated source and Windows runtime
        uses: actions/upload-artifact@v4
        with:
          name: Johnas-Local-Pilot-Windows-x64
          path: build/Johnas-Local-Pilot/**
          retention-days: 14
          if-no-files-found: error
