name: Raw transfer isolated SQL proof
on:
  pull_request:
    paths:
      - 'scripts/db/candidates/raw-transfer-proof.mjs'
      - 'scripts/db/candidates/raw_transfer_safety_baseline.json'
      - 'scripts/rollback/raw_transfer_safety_20261021.sql'
      - 'supabase/migrations/*_raw_transfer_safety.sql'
      - '.github/workflows/raw-transfer-proof.yml'
permissions:
  contents: read
jobs:
  isolated-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned disposable Postgres engine
        run: npm install --prefix /tmp/finance-payment-proof --no-save --ignore-scripts @electric-sql/pglite@0.3.14
      - name: Reproduce original failure and verify repair and rollback on owned synthetic rows
        env:
          TRANSFER_PGLITE_MODULE: /tmp/finance-payment-proof/node_modules/@electric-sql/pglite
        run: node scripts/db/candidates/raw-transfer-proof.mjs
