name: Receipt visual unification once

on:
  push:
    branches:
      - development/receipt-visual-unification
    paths:
      - .github/workflows/receipt-visual-unification-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/receipt-visual-unification
          fetch-depth: 0
      - name: Apply visual-only receipt typography update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/pos/utils/printing.ts')
          s = p.read_text(encoding='utf-8')
          replacements = {
            "  const sidePaddingMm = compact ? 2 : 3;\n  const bodyFontPx = compact ? 11 : 12;\n  const smallFontPx = compact ? 9 : 10;\n  const itemFontPx = compact ? 11 : 12;\n  const totalFontPx = compact ? 15 : 16;":
            "  // Visual-only receipt profile: identical typography scale for Arabic and English.\n  // Routing, authorization, queueing, printer selection and Print Agent behavior stay unchanged.\n  const sidePaddingMm = compact ? 2.4 : 3.2;\n  const bodyFontPx = compact ? 12 : 13;\n  const smallFontPx = compact ? 10 : 11;\n  const itemFontPx = compact ? 12 : 13;\n  const totalFontPx = compact ? 16 : 18;",
            "          font-family: Tahoma, Arial, \"Segoe UI\", sans-serif;\n          font-size: ${bodyFontPx}px;\n          line-height: 1.35;":
            "          font-family: Arial, Tahoma, \"Segoe UI\", sans-serif;\n          font-size: ${bodyFontPx}px;\n          line-height: 1.45;\n          font-weight: 600;\n          letter-spacing: 0;\n          text-rendering: optimizeLegibility;\n          font-synthesis: none;",
            "          padding: 2.5mm ${sidePaddingMm}mm 4mm;":
            "          padding: 3mm ${sidePaddingMm}mm 4mm;",
            "          font-size: ${compact ? 15 : 17}px;\n          line-height: 1.2;":
            "          font-size: ${compact ? 16 : 18}px;\n          line-height: 1.3;",
            "          line-height: 1.35;\n          overflow-wrap: anywhere;\n        }\n        .branch-name":
            "          line-height: 1.45;\n          overflow-wrap: anywhere;\n        }\n        .branch-name",
            "          margin: .65mm 0;\n          min-width: 0;":
            "          margin: .8mm 0;\n          min-width: 0;\n          line-height: 1.4;",
            "          padding: 1.3mm 0;":
            "          padding: 1.5mm 0;",
            "          margin-bottom: .6mm;\n          font-size: ${itemFontPx}px;\n          line-height: 1.3;":
            "          margin-bottom: .7mm;\n          font-size: ${itemFontPx}px;\n          line-height: 1.4;",
            "        .item-detail { font-size: ${smallFontPx}px; }":
            "        .item-detail { font-size: ${smallFontPx}px; line-height: 1.4; font-weight: 600; }",
            "          margin: .8mm 0;\n          font-size: ${bodyFontPx}px;":
            "          margin: 1mm 0;\n          font-size: ${bodyFontPx}px;\n          line-height: 1.4;",
            "          line-height: 1.4;\n          overflow-wrap: anywhere;\n        }\n        .thank-you":
            "          line-height: 1.5;\n          overflow-wrap: anywhere;\n        }\n        .thank-you"
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected visual snippet not found: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Add visual contract test
        shell: bash
        run: |
          cat > tests/unit/receiptVisualUnificationContract.test.ts <<'EOF'
          import { readFileSync } from 'node:fs';
          import { describe, expect, it } from 'vitest';

          describe('receipt visual unification contract', () => {
            const source = readFileSync('src/features/pos/utils/printing.ts', 'utf8');

            it('uses one shared Arabic/English receipt typography profile', () => {
              expect(source).toContain('const bodyFontPx = compact ? 12 : 13;');
              expect(source).toContain('const itemFontPx = compact ? 12 : 13;');
              expect(source).toContain('const totalFontPx = compact ? 16 : 18;');
              expect(source).toContain('font-family: Arial, Tahoma, "Segoe UI", sans-serif;');
              expect(source).toContain('text-rendering: optimizeLegibility;');
              expect(source).not.toMatch(/isAr\s*\?\s*\d+\s*:\s*\d+/);
            });

            it('keeps existing print authority and routing primitives intact', () => {
              expect(source).toContain("supabase.rpc('authorize_sale_print'");
              expect(source).toContain("supabase.rpc('record_sale_print'");
              expect(source).toContain('enqueueCloudReceiptPrint({');
              expect(source).toContain('executeSilentPrint({');
              expect(source).toContain('getLocalPrinterRoutes()');
            });
          });
          EOF
      - name: Remove temporary workflow from resulting commit
        shell: bash
        run: rm .github/workflows/receipt-visual-unification-once.yml
      - name: Commit visual-only changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/pos/utils/printing.ts tests/unit/receiptVisualUnificationContract.test.ts .github/workflows/receipt-visual-unification-once.yml
          git commit -m "style(receipt): unify Arabic and English receipt typography"
          git push origin HEAD:development/receipt-visual-unification
