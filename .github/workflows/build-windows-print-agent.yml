name: Build Windows Print Agent

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron/**'
      - 'src/features/pos/services/**print**'
      - 'src/features/pos/services/kitchen.ts'
      - 'src/features/pos/components/settings/**'
      - 'src/app/App.tsx'
      - 'supabase/migrations/**cloud_print**'
      - '.github/workflows/build-windows-print-agent.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies including Windows native optionals
        run: npm install --include=optional --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Install Print Agent dependencies
        working-directory: electron
        run: npm install --include=optional --no-audit --no-fund

      - name: Test isolated printer queues
        working-directory: electron
        run: npm run test:queue

      - name: Build Windows installer and portable app
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: premier-print-agent-windows
          path: |
            electron/release/*.exe
            electron/release/*.blockmap
          if-no-files-found: error
          retention-days: 14
