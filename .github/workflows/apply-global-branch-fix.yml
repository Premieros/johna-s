name: Apply global branch context fix

on:
  push:
    branches:
      - development/global-branch-context

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded codemod
        run: python3 scripts/apply_global_branch_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Remove temporary codemod machinery
        run: |
          rm -f scripts/apply_global_branch_fix.py
          rm -f .github/workflows/apply-global-branch-fix.yml

      - name: Commit verified branch fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(branch): unify active branch across operational pages"
          git push origin HEAD:development/global-branch-context
