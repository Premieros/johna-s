name: Apply global branch context fix

on:
  push:
    branches:
      - development/global-branch-context

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch guarded codemod double-label expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_global_branch_fix.py')
          text = p.read_text(encoding='utf-8')
          old = "replace_once(rel, \"branches.find((b) => b.id === user?.branch_id)?.name\", \"branches.find((b) => b.id === (branchFilter || user?.branch_id))?.name\", 'shift modal active branch label')"
          new = "old_branch_label = \"branches.find((b) => b.id === user?.branch_id)?.name\"\nnew_branch_label = \"branches.find((b) => b.id === (branchFilter || user?.branch_id))?.name\"\ntext = read(rel)\nif text.count(old_branch_label) != 2:\n    raise RuntimeError(f'{rel}: expected two shift modal branch labels, found {text.count(old_branch_label)}')\nwrite(rel, text.replace(old_branch_label, new_branch_label))"
          if text.count(old) != 1:
              raise SystemExit('guard patch target did not match exactly once')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply guarded codemod
        run: python3 scripts/apply_global_branch_fix.py

      - name: Remove branch-selector lint residue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/accounting/pages/PaymentsPage.tsx')
          text = p.read_text(encoding='utf-8')
          old = "  const isAr = lang === 'ar';\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one Payments isAr residue, found {text.count(old)}')
          p.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee unit-test-output.txt

      - name: Upload unit test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-branch-unit-output
          path: unit-test-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary codemod machinery
        run: |
          rm -f scripts/apply_global_branch_fix.py
          rm -f .github/workflows/apply-global-branch-fix.yml

      - name: Commit verified branch fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(branch): unify active branch across operational pages"
          git push origin HEAD:development/global-branch-context
