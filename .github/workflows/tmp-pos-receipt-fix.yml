name: Temporary POS receipt fix

on:
  push:
    branches:
      - fix/pos-customer-receipt-single-print-20260916

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pos-customer-receipt-single-print-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/features/pos/pages/PosWorkspacePage.tsx')
          text = page.read_text()
          old = """    onPrintReceipt: () => {\n      if (perms.canPrintKitchen && pos.cart.length > 0) pos.printKitchenTicket();\n    },"""
          new = """    onPrintReceipt: () => {\n      if (perms.canPrint && pos.lastReceipt && pos.cart.length === 0) void pos.printReceipt();\n    },"""
          if old not in text:
              raise SystemExit('keyboard print block not found')
          text = text.replace(old, new, 1)
          count = text.count('onPrint={pos.printKitchenTicket}')
          if count < 1:
              raise SystemExit('POS kitchen print callback not found')
          text = text.replace('onPrint={pos.printKitchenTicket}', 'onPrint={() => void pos.printReceipt()}')
          marker = "itemsCount={pos.cart.reduce((s, it) => s + it.quantity, 0)}"
          if marker not in text:
              raise SystemExit('PosOrderHeaderBar itemsCount marker not found')
          text = text.replace(marker, marker + "\n            canPrintReceipt={!!pos.lastReceipt && pos.cart.length === 0}", 1)
          modal_old = """            <button\n              onClick={() => void pos.printReceipt()}\n              className=\"w-full inline-flex items-center justify-center gap-2 py-3 rounded-xl bg-ui-primary hover:bg-ui-primary-hover text-ui-primary-fg font-bold transition-colors\"\n            >\n              <Printer className=\"w-5 h-5\" /> {t('printReceipt')}\n            </button>"""
          modal_new = """            {perms.canPrint && (\n              <button\n                data-testid=\"pos-receipt-print\"\n                onClick={() => void pos.printReceipt()}\n                className=\"w-full inline-flex items-center justify-center gap-2 py-3 rounded-xl bg-ui-primary hover:bg-ui-primary-hover text-ui-primary-fg font-bold transition-colors\"\n              >\n                <Printer className=\"w-5 h-5\" /> {t('printReceipt')}\n              </button>\n            )}"""
          if modal_old not in text:
              raise SystemExit('receipt modal print button not found')
          text = text.replace(modal_old, modal_new, 1)
          page.write_text(text)

          header = Path('src/features/pos/components/order/PosOrderHeaderBar.tsx')
          text = header.read_text()
          text = text.replace('  itemsCount: number;\n', '  itemsCount: number;\n  canPrintReceipt: boolean;\n', 1)
          text = text.replace('  itemsCount,\n', '  itemsCount,\n  canPrintReceipt,\n', 1)
          old = '{perms.canPrintKitchen && itemsCount > 0 && ('
          new = '{perms.canPrint && canPrintReceipt && ('
          if old not in text:
              raise SystemExit('header print permission block not found')
          text = text.replace(old, new, 1)
          header.write_text(text)

          test = Path('tests/components/pos-customer-receipt-print-contract.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest';\nimport fs from 'node:fs';\nimport path from 'node:path';\n\nconst root = process.cwd();\nconst workspace = fs.readFileSync(path.join(root, 'src/features/pos/pages/PosWorkspacePage.tsx'), 'utf8');\nconst header = fs.readFileSync(path.join(root, 'src/features/pos/components/order/PosOrderHeaderBar.tsx'), 'utf8');\nconst printing = fs.readFileSync(path.join(root, 'src/features/pos/utils/printing.ts'), 'utf8');\n\ndescribe('POS customer receipt print contract', () => {\n  it('routes sale-screen print actions to the customer receipt, not the kitchen ticket', () => {\n    expect(workspace).not.toContain('onPrint={pos.printKitchenTicket}');\n    expect(workspace).toContain('onPrint={() => void pos.printReceipt()}');\n    expect(workspace).toContain('perms.canPrint && pos.lastReceipt && pos.cart.length === 0');\n  });\n\n  it('gates the visible print action with pos.receipt.print', () => {\n    expect(header).toContain('perms.canPrint && canPrintReceipt');\n    expect(header).not.toContain('perms.canPrintKitchen && itemsCount > 0');\n    expect(workspace).toContain('data-testid=\"pos-receipt-print\"');\n    expect(workspace).toContain('{perms.canPrint && (');\n  });\n\n  it('keeps the existing single-print and manager-approved reprint authorization', () => {\n    expect(printing).toContain("supabase.rpc('authorize_sale_print'");\n    expect(printing).toContain("initial.error !== 'MANAGER_APPROVAL_REQUIRED'");\n    expect(printing).toContain("p_action_type: 'reprint'");\n    expect(printing).toContain("supabase.rpc('record_sale_print'");\n  });\n});\n""")
          PY
      - name: Remove temporary workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/tmp-pos-receipt-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/pos/pages/PosWorkspacePage.tsx src/features/pos/components/order/PosOrderHeaderBar.tsx tests/components/pos-customer-receipt-print-contract.test.ts .github/workflows/tmp-pos-receipt-fix.yml
          git commit -m "fix(pos): print customer receipt from sale screen"
          git push origin HEAD:fix/pos-customer-receipt-single-print-20260916
