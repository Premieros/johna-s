name: Build Lenovo Tab One kiosk (test APK)

on:
  pull_request:
    paths:
      - 'android-kiosk/**'
      - '.github/workflows/build-tablet-kiosk.yml'
  push:
    branches: ['feat/lenovo-tab-one-kiosk-20261009']
    paths:
      - 'android-kiosk/**'
      - '.github/workflows/build-tablet-kiosk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu GitHub runners already contain Android cmdline-tools. The older
      # setup-android action invokes the removed SDK 'tools' package and fails.
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK and run unit tests
        working-directory: android-kiosk
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: johnas-tab-one-TEST-APK-not-for-device-owner
          path: android-kiosk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
