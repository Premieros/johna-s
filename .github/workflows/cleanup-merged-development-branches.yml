name: Cleanup merged development branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-development-branches.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-merged-development-branches
  cancel-in-progress: false

jobs:
  cleanup:
    name: delete-merged-and-confirmed-superseded-development-branches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete safe development branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 200 \
            --json headRefName \
            --jq '.[].headRefName' \
            > /tmp/open-heads.txt

          deleted_merged=0
          deleted_superseded=0
          skipped=0
          failed=0

          mapfile -t merged_branches < <(
            git for-each-ref \
              --format='%(refname:short)' \
              refs/remotes/origin/development/ \
            | sed 's#^origin/##' \
            | while read -r branch; do
                if git merge-base --is-ancestor "origin/$branch" origin/main; then
                  printf '%s\n' "$branch"
                fi
              done \
            | sort
          )

          for branch in "${merged_branches[@]}"; do
            if grep -Fxq "$branch" /tmp/open-heads.txt; then
              echo "SKIP open PR head: $branch"
              skipped=$((skipped + 1))
              continue
            fi
            echo "DELETE fully merged branch: $branch"
            if git push origin --delete "$branch"; then
              deleted_merged=$((deleted_merged + 1))
            else
              echo "::error::Could not delete $branch"
              failed=$((failed + 1))
            fi
          done

          cat > /tmp/confirmed-superseded.txt <<'EOF'
          development/ci-integration-deadlock-fix
          development/docs-sync-2026-09-16
          development/header-cleanup
          development/manufacturing-rpc-authority
          development/modifier-simple-product-assignment
          development/pay-sent-order-zreport-fix-20260918
          development/print-agent-clean-merge-final2
          development/print-agent-final-clean
          development/print-agent-final-merge
          development/print-agent-lite-reliability-20260917
          development/print-agent-merge-clean-2
          development/print-agent-merge-final
          development/print-agent-merge-ready
          development/safe-display-columns
          development/stabilization-audit-20260915
          development/status-registry-unification
          development/status-registry-unification-v2
          development/table-occupancy-reconciliation
          development/windows-print-station-production-ready-20260918
          EOF

          while IFS= read -r branch; do
            branch="${branch#"  "}"
            [ -z "$branch" ] && continue

            if grep -Fxq "$branch" /tmp/open-heads.txt; then
              echo "SKIP open PR head: $branch"
              skipped=$((skipped + 1))
              continue
            fi

            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "ALREADY GONE: $branch"
              continue
            fi

            echo "DELETE confirmed superseded branch: $branch"
            if git push origin --delete "$branch"; then
              deleted_superseded=$((deleted_superseded + 1))
            else
              echo "::error::Could not delete $branch"
              failed=$((failed + 1))
            fi
          done < /tmp/confirmed-superseded.txt

          echo "Deleted fully merged: $deleted_merged"
          echo "Deleted confirmed superseded: $deleted_superseded"
          echo "Skipped open PR heads: $skipped"
          echo "Failed: $failed"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
