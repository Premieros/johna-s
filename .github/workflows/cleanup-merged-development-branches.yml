name: Cleanup fully merged development branches

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-development-branches.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-fully-merged-development-branches
  cancel-in-progress: false

jobs:
  cleanup:
    name: delete-proven-merged-development-branches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete only proven merged development branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          deleted_file="/tmp/deleted-branches.txt"
          kept_print_file="/tmp/kept-print-branches.txt"
          kept_active_file="/tmp/kept-active-branches.txt"
          kept_unmerged_file="/tmp/kept-unmerged-branches.txt"
          kept_failed_file="/tmp/kept-failed-branches.txt"
          : > "$deleted_file"
          : > "$kept_print_file"
          : > "$kept_active_file"
          : > "$kept_unmerged_file"
          : > "$kept_failed_file"

          is_print_name() {
            local n="${1,,}"
            [[ "$n" =~ print|printer|receipt|thermal|zreport|ticket|fixed-template|fixed-form ]]
          }

          merged_prs_for_branch() {
            local branch="$1"
            gh pr list               --repo "$GITHUB_REPOSITORY"               --state merged               --base main               --head "$branch"               --limit 100               --json number               --jq '.[].number'
          }

          branch_prs_touch_printing() {
            local branch="$1"
            local pr files prs
            prs="$(merged_prs_for_branch "$branch" 2>/dev/null)" || return 2
            [[ -z "$prs" ]] && return 1

            while IFS= read -r pr; do
              [[ -z "$pr" ]] && continue
              files="$(gh pr view "$pr"                 --repo "$GITHUB_REPOSITORY"                 --json files                 --jq '.files[].path' 2>/dev/null)" || return 2

              if grep -Eiq 'print|printer|receipt|thermal|zreport|ticket' <<<"$files"; then
                return 0
              fi
            done <<<"$prs"

            return 1
          }

          has_open_pr() {
            local branch="$1"
            local count
            count="$(gh pr list               --repo "$GITHUB_REPOSITORY"               --state open               --head "$branch"               --limit 100               --json number               --jq 'length' 2>/dev/null)" || return 2
            [[ "$count" != "0" ]]
          }

          mapfile -t branches < <(
            git for-each-ref               --format='%(refname:short)'               refs/remotes/origin/development/               | sed 's#^origin/##'               | sort -u
          )

          for branch in "${branches[@]}"; do
            [[ -z "$branch" ]] && continue
            [[ "$branch" != development/* ]] && continue

            if is_print_name "$branch"; then
              echo "$branch | protected by print-related branch name" >> "$kept_print_file"
              continue
            fi

            has_open_pr "$branch"
            open_rc=$?
            if [[ $open_rc -eq 0 ]]; then
              echo "$branch | has open PR" >> "$kept_active_file"
              continue
            elif [[ $open_rc -eq 2 ]]; then
              echo "$branch | open PR check failed" >> "$kept_failed_file"
              continue
            fi

            if ! git merge-base --is-ancestor "origin/$branch" origin/main 2>/dev/null; then
              echo "$branch | branch tip not fully contained in main" >> "$kept_unmerged_file"
              continue
            fi

            prs="$(merged_prs_for_branch "$branch" 2>/dev/null || true)"
            if [[ -z "$prs" ]]; then
              echo "$branch | no merged PR to main found" >> "$kept_unmerged_file"
              continue
            fi

            branch_prs_touch_printing "$branch"
            print_rc=$?
            if [[ $print_rc -eq 0 ]]; then
              echo "$branch | protected because merged PR touched print-related files" >> "$kept_print_file"
              continue
            elif [[ $print_rc -eq 2 ]]; then
              echo "$branch | print-file check failed" >> "$kept_failed_file"
              continue
            fi

            echo "DELETE fully merged development branch: $branch"
            if git push origin --delete "$branch"; then
              echo "$branch" >> "$deleted_file"
            else
              echo "$branch | deletion failed" >> "$kept_failed_file"
            fi
          done

          {
            echo "## Fully merged development branch cleanup"
            echo
            echo "Rules: development/* only; no open PR; tip must be ancestor of main; merged PR to main required; print-related names/files preserved."
            echo
            echo "### Deleted"
            if [[ -s "$deleted_file" ]]; then sed 's/^/- /' "$deleted_file"; else echo "- none"; fi
            echo
            echo "### Preserved — printing"
            if [[ -s "$kept_print_file" ]]; then sed 's/^/- /' "$kept_print_file"; else echo "- none"; fi
            echo
            echo "### Preserved — active/open PR"
            if [[ -s "$kept_active_file" ]]; then sed 's/^/- /' "$kept_active_file"; else echo "- none"; fi
            echo
            echo "### Preserved — not proven fully merged"
            if [[ -s "$kept_unmerged_file" ]]; then sed 's/^/- /' "$kept_unmerged_file"; else echo "- none"; fi
            echo
            echo "### Preserved — safety/check failure"
            if [[ -s "$kept_failed_file" ]]; then sed 's/^/- /' "$kept_failed_file"; else echo "- none"; fi
          } >> "$GITHUB_STEP_SUMMARY"
