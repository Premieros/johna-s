name: Cleanup completed old branches

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-development-branches.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cleanup-completed-old-branches
  cancel-in-progress: false

jobs:
  cleanup:
    name: delete-old-completed-branches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete old completed branches and preserve print work
        env:
          GH_TOKEN: ${{ github.token }}
          # 2026-09-23 00:00 Africa/Cairo = 2026-09-22 21:00 UTC
          CUTOFF_UTC: "2026-09-22T21:00:00Z"
        shell: bash
        run: |
          set -u

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          cutoff_epoch="$(date -d "$CUTOFF_UTC" +%s)"

          deleted_file="/tmp/deleted-branches.txt"
          kept_print_file="/tmp/kept-print-branches.txt"
          kept_today_file="/tmp/kept-today-branches.txt"
          kept_failed_file="/tmp/kept-failed-branches.txt"
          : > "$deleted_file"
          : > "$kept_print_file"
          : > "$kept_today_file"
          : > "$kept_failed_file"

          is_print_name() {
            local n="${1,,}"
            [[ "$n" =~ print|printer|receipt|thermal|zreport|ticket|fixed-template|fixed-form ]]
          }

          has_print_branch_diff() {
            local branch="$1"
            local base files
            base="$(git merge-base origin/main "origin/$branch" 2>/dev/null)" || return 2
            files="$(git diff --name-only "$base" "origin/$branch" 2>/dev/null)" || return 2
            grep -Eiq 'print|printer|receipt|thermal|zreport|ticket' <<<"$files"
          }

          draft_open_prs() {
            local branch="$1"
            local rows
            rows="$(gh pr list               --repo "$GITHUB_REPOSITORY"               --state open               --head "$branch"               --limit 100               --json number,isDraft               --jq '.[] | [.number, .isDraft] | @tsv' 2>/dev/null || true)"

            [[ -z "$rows" ]] && return 0

            while IFS=$'\t' read -r number draft; do
              [[ -z "$number" ]] && continue
              if [[ "$draft" == "true" ]]; then
                echo "PR #$number already Draft for $branch"
                continue
              fi

              echo "Convert PR #$number to Draft before deleting $branch"
              if ! gh pr ready --undo "$number" --repo "$GITHUB_REPOSITORY"; then
                echo "::warning::Could not convert PR #$number to Draft; preserving $branch"
                return 1
              fi
            done <<<"$rows"
          }

          mapfile -t branches < <(
            git for-each-ref               --format='%(refname:short)'               refs/remotes/origin/             | sed 's#^origin/##'             | grep -v '^HEAD$'             | sort -u
          )

          for branch in "${branches[@]}"; do
            [[ -z "$branch" ]] && continue
            [[ "$branch" == "main" ]] && continue

            commit_epoch="$(git log -1 --format=%ct "origin/$branch" 2>/dev/null || true)"
            commit_iso="$(git log -1 --format=%cI "origin/$branch" 2>/dev/null || true)"

            if [[ -z "$commit_epoch" ]]; then
              echo "$branch | commit date unavailable" >> "$kept_failed_file"
              continue
            fi

            if (( commit_epoch >= cutoff_epoch )); then
              echo "$branch | $commit_iso" >> "$kept_today_file"
              continue
            fi

            if is_print_name "$branch"; then
              echo "$branch | protected by print-related branch name | $commit_iso" >> "$kept_print_file"
              continue
            fi

            if has_print_branch_diff "$branch"; then
              echo "$branch | protected by print-related branch diff | $commit_iso" >> "$kept_print_file"
              continue
            else
              diff_rc=$?
              if [[ $diff_rc -eq 2 ]]; then
                echo "$branch | diff check failed; preserved safely | $commit_iso" >> "$kept_failed_file"
                continue
              fi
            fi

            if ! draft_open_prs "$branch"; then
              echo "$branch | PR Draft conversion failed | $commit_iso" >> "$kept_failed_file"
              continue
            fi

            echo "DELETE completed old branch: $branch"
            if git push origin --delete "$branch"; then
              echo "$branch | $commit_iso" >> "$deleted_file"
            else
              echo "$branch | deletion failed | $commit_iso" >> "$kept_failed_file"
            fi
          done

          {
            echo "## Completed old branch cleanup"
            echo
            echo "Cutoff: 2026-09-23 00:00 Africa/Cairo ($CUTOFF_UTC)"
            echo
            echo "### Deleted"
            if [[ -s "$deleted_file" ]]; then sed 's/^/- /' "$deleted_file"; else echo "- none"; fi
            echo
            echo "### Preserved — printing"
            if [[ -s "$kept_print_file" ]]; then sed 's/^/- /' "$kept_print_file"; else echo "- none"; fi
            echo
            echo "### Preserved — active today"
            if [[ -s "$kept_today_file" ]]; then sed 's/^/- /' "$kept_today_file"; else echo "- none"; fi
            echo
            echo "### Preserved — safety/failure"
            if [[ -s "$kept_failed_file" ]]; then sed 's/^/- /' "$kept_failed_file"; else echo "- none"; fi
          } >> "$GITHUB_STEP_SUMMARY"
