name: Build Premier Print Agent Lite

on:
  pull_request:
    paths:
      - 'print-agent-lite/**'
      - 'local-print-agent/**'
      - '.github/workflows/build-print-agent-lite.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lite:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore print-agent-lite/PremierPrintAgentLite.csproj
      - name: Build Release
        run: dotnet build print-agent-lite/PremierPrintAgentLite.csproj -c Release --no-restore
      - name: Validate legacy Unicode print helper
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File local-print-agent/print-escpos-raster.ps1 -ValidateOnly
      - name: Validate local agent restart script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'local-print-agent/restart-agent.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'restart-agent.ps1 syntax validation failed'
          }
      - name: Package Lite ZIP
        shell: pwsh
        run: |
          $out = 'print-agent-lite/bin/Release/net48'
          if (!(Test-Path "$out/PremierPrintAgentLite.exe")) { throw 'Lite EXE not found' }
          Compress-Archive -Path "$out/*" -DestinationPath 'Premier-Print-Agent-Lite-Windows-x64.zip' -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: premier-print-agent-lite-windows
          path: Premier-Print-Agent-Lite-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Package Cleopatra local agent
        shell: pwsh
        run: |
          $stage = 'cleopatra-print-agent'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'local-print-agent/agent.cjs' $stage
          Copy-Item 'local-print-agent/print-escpos-raster.ps1' $stage
          Copy-Item 'local-print-agent/restart-agent.ps1' $stage
          Copy-Item 'local-print-agent/start.cmd' $stage
          Copy-Item 'local-print-agent/install-startup.cmd' $stage
          Copy-Item 'local-print-agent/README.md' $stage
          Copy-Item 'local-print-agent/cleopatra-stations.json' $stage
          Copy-Item 'local-print-agent/printer-preflight.ps1' $stage
          @'
          CLEOPATRA ONLY
          This package is for the Cleopatra Windows print-agent computer only.
          Do not install or copy it to the Smouha branch computer.
          Transport: escpos-raw-raster
          Agent health version: 6
          '@ | Set-Content -Path "$stage/CLEOPATRA_ONLY.txt" -Encoding UTF8
          Compress-Archive -Path "$stage/*" -DestinationPath 'Cleopatra-Print-Agent-v6-Windows.zip' -Force
      - name: Upload Cleopatra local agent
        uses: actions/upload-artifact@v4
        with:
          name: cleopatra-print-agent-v6-windows
          path: Cleopatra-Print-Agent-v6-Windows.zip
          if-no-files-found: error
          retention-days: 14
